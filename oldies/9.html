<body><button id="theme-toggle">🌙</button>
  <header>
    <h1>izran Ralla Yemma</h1>
    <p>Vidéos officielles • Rif Music</p>
    <div style="margin-top: 16px; max-width: 500px; margin: 16px auto 0;">
      <input type="text" id="search-input" placeholder="Rechercher une vidéo..." 
             style="width: 100%; padding: 10px; font-size: 15px; border: 1px solid #ddd; border-radius: 24px; outline: none;">
    </div>
  </header>

  <main id="grid"></main>

  <div id="player-container">
    <button id="close-btn" aria-label="Fermer">&times;</button>
    <div id="player-wrapper">
      <!-- Lecteur Video.js -->
      <video id="my-video" class="video-js" controls preload="auto" playsinline>
        <source src="" type="video/mp4" />
      </video>
    </div>
    <div id="video-title"></div>
  </div>

  <!-- Script Video.js -->
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  
  <script>
    // 🔹 Votre Playlist
    const playlist = [
      {
        title: "1-IZRAN Athajar A Yemma By Nawal HD",
        file: "https://archive.org/download/izran-athajar-a-yemma-by-nawal-hd/IZRAN Athajar a Yemma By  Nawal  HD.mp4",
image: "cover.jpg"
      },
      {
        title: "2-IZRAN NARIF Yemma true By Nawal Rif Music 2022 HD",
        file: "https://archive.org/download/top-mix-izran-best-off-2023-part-10-hd/IZRAN NARIF Yemma true By Nawal Rif Music 2022 HD.mp4",
image: "cover.jpg"
      },
      {
        title: "3-IZRAN RALLA YEMMA 2021 Rif Music HD",
        file: "https://archive.org/download/top-izran-narif-mega-mix-best-off-2023-part-24-hd/IZRAN RALLA YEMMA 2021 Rif Music HD.mp4",
image: "cover.jpg"
      },
      {
        title: "4-izran Ralla Yemma By Achraf Rai & Rap Music 2024 HD",
        file: "https://archive.org/download/izran-ralla-yemma-by-achraf-2024-hd/izran Ralla Yemma By Achraf 2024 HD.mp4",
image: "cover.jpg"
      },
      {
        title: "5-Izran Ralla Yemma By Silya HD",
        file: "https://archive.org/download/silya-izran-ralla-mama-hd/SILYA IZRAN RALLA MAMA HD.mp4",
image: "cover.jpg"
      },
      {
        title: "6-Izran Ralla Yemma Cem Thanouer Ino Rif Music 2023 4K UHD",
        file: "https://archive.org/download/top-mix-izran-best-off-2023-part-6-hd/Izran Ralla Yemma Cem Thanouer Ino Rif Music 2023 4K UHD.mp4",
image: "cover.jpg"
      },
      {
        title: "7-Mix Izran Ralla Yemma By Isma3il Ak Simane Rif Music 2023 HD",
        file: "https://archive.org/download/top-izran-mix-music-2023-part-2-hd/Mix Izran Ralla Yemma By Isma3il Ak Simane Rif Music 2023 HD.mp4",
image: "cover.jpg"
      },
      {
        title: "8-Said Mariwari Izran Ijen Yemma Ghari Rif Music 2024 HD",
        file: "https://archive.org/download/said-mariwari-izran-ijen-yemma-ghari-rif-music-2024-hd/Said Mariwari izran ijen Yemma Ghari Rif Music 2024 HD.mp4",
image: "cover.jpg"
      },
      {
        title: "9-SIMANE IZRAN RALLA YEMMA RIF MUSIC 2023 HD",
        file: "https://archive.org/download/top-mix-izran-best-off-2023-part-9-hd/SIMANE IZRAN RALLA YEMMA RIF MUSIC 2023 HD.mp4",
image: "cover.jpg"
      },
      {
        title: "10-Top 10 izran Ralla yemma Rif Music 2024 HD",
        file: "https://archive.org/download/top-10-izran-ralla-yemma-rif-music-2024-hd/Top 10 izran Ralla yemma Rif Music 2024 HD.mp4",
image: "cover.jpg"
      },
      {
        title: "11-Top 10 Izran Ralla Yemma Rif Music 2024 HQ",
        file: "https://archive.org/download/top-10-izran-ralla-yemma-rif-music-2024-hq/Top 10 izran Ralla Yemma Rif Music 2024 HQ.mp4",
image: "cover.jpg"
      }
    ];

    // 🔹 Génération de la grille
    const grid = document.getElementById('grid');
    playlist.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = 'thumbnail-item';
      const thumb = item.image || 'https://via.placeholder.com/300?text=Vidéo';
      div.innerHTML = `
        <img src="${thumb}" alt="${item.title}" loading="lazy">
        <div class="title">${item.title}</div>
      `;
      div.onclick = () => playVideo(index);
      grid.appendChild(div);
    });

    // 🔹 Initialisation de Video.js
    const player = videojs('my-video', {
      fluid: true, // S'adapte à la taille de l'écran
      responsive: true,
      playbackRates: [0.5, 1, 1.25, 1.5, 2], // Vitesse de lecture
      controlBar: {
        pictureInPictureToggle: true // Mode Picture-in-Picture
      }
    });

    let currentPlaylistIndex = 0;

    // 🔹 Fonction pour lire une vidéo spécifique
    function playVideo(index) {
      currentPlaylistIndex = index;
      const item = playlist[index];
      
      document.getElementById('video-title').textContent = item.title;
      document.getElementById('player-container').classList.add('active');

      // Mise à jour de la source dans Video.js
      player.src({ type: 'video/mp4', src: item.file });
      player.poster(item.image);
      
      // Lancement de la vidéo
      player.play().catch(e => console.log("Autoplay bloqué par le navigateur, l'utilisateur doit cliquer sur play."));
    }

    // 🔹 Avance automatique à la vidéo suivante
    player.on('ended', function() {
      if (currentPlaylistIndex < playlist.length - 1) {
        playVideo(currentPlaylistIndex + 1);
      }
    });

    // 🔹 Bouton de fermeture
    function closePlayer() {
      document.getElementById('player-container').classList.remove('active');
      player.pause();
    }
    document.getElementById('close-btn').onclick = closePlayer;

    // 🔍 Système de recherche
    document.getElementById('search-input').addEventListener('input', function(e) {
      const query = e.target.value.toLowerCase();
      const items = document.querySelectorAll('.thumbnail-item');
      
      items.forEach(item => {
        const title = item.querySelector('.title').textContent.toLowerCase();
        item.style.display = title.includes(query) ? 'block' : 'none';
      });
    });
  </script>
