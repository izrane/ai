<body><button id="theme-toggle">🌙</button>

    <div style="margin-top: 16px; max-width: 500px; margin: 16px auto 0;">
      <input type="text" id="search-input" placeholder="Rechercher une vidéo..." 
             style="width: 100%; padding: 10px; font-size: 15px; border: 1px solid #ddd; border-radius: 24px; outline: none;">
    </div>
  </header>

  <main id="grid"></main>

  <div id="player-container">

    <div id="player-wrapper">
      <!-- Lecteur Video.js -->
      <video id="my-video" class="video-js" controls preload="auto" playsinline>
        <source src="" type="video/mp4" />
      </video>
    </div>
    <div id="video-title"></div>
  </div>

  <!-- Script Video.js -->
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  
  <script>
    // 🔹 Votre Playlist
    const playlist = [


  {
        title: "Anashid la ilaha ila lahe HD",
        file: "https://archive.org/download/izran-masallah/izran%20masallah.mp4",
image: "cover.jpg"
      },


      
      {
        title: "Anashid RIF Allah ino HD",
        file: "https://archive.org/download/movies-top-izran-mix-music-2023-part-3-hd/Anashid  RIF Allah ino HD.mp4",
image: "cover.jpg"
      },
      {
        title: "Anashid Alhamdo Lillah Ya Rebi By isma3il bel3ouch 2023 HD",
        file: "https://archive.org/download/movies-top-izran-narif-mega-mix-best-off-2023-part-13-hd/Anashid Alhamdo Lillah Ya Rebi By isma3il bel3ouch 2023 HD.mp4",
image: "cover.jpg"
      },
      {
        title: "Anashid izran Salu 3ala Nabi By isma3il Bel3ouch 2024 HD",
        file: "https://archive.org/download/anashid-izran-salu-3ala-nabi-2024-hd/Salu 3ala nabi hd.mp4",
image: "cover.jpg"
      },
      {
        title: "Anashid izran Subhanka Allah By Bader Soltan 4K UHD",
        file: "https://archive.org/download/movies-top-izran-narif-mega-mix-best-off-2023-part-13-hd/Anashid izran Subhanka Allah By Bader Soltan 2023 4K UHD.mp4",
image: "cover.jpg"
      },
      {
        title: "Anashid NaRif izran Allah Ya allah By Mohamed Special Ramadan 2024 HD",
        file: "https://archive.org/download/izran-moh-special-2024-hd/izran moh specal 2024 HD.mp4",
image: "cover.jpg"
      },
      {
        title: "Anashid Ramadan Mobarak 2024 HD",
        file: "https://archive.org/download/izran-rif-2024-hd/izran rif 2024 HD.mp4",
image: "cover.jpg"
      },
      {
        title: "Anashid Rif Special Ramadan 2022 4K UHD",
        file: "https://archive.org/download/top-izran-narif-mega-mix-best-off-2023-part-22-hd/Anashid Rif Special Ramadan 2022 4K UHD.mp4",
image: "cover.jpg"
      },

      {
        title: "Anashid NaRif Raghigh Cek Sidi Rebi By Mossebih 2024 HD",
        file: "https://archive.org/download/anashid-na-rif-raghigh-cek-sidi-rebi-by-mossebih-2024-hd/Anashid NaRif Raghigh Cek Sidi Rebi By Mossebih 2024 HD.mp4",
image: "cover.jpg"
      },
      {
        title: "ANZAR -RIF ANASHID MUSIC HD",
        file: "https://archive.org/download/top-izran-narif-mega-mix-best-off-2023-part-24-hd/ANZAR -RIF ANASHID MUSIC 2021 HD.mp4",
image: "cover.jpg"
      },
      {
        title: "ISMA3IL BELE3OUCH ANASHID RIF 2021 HD",
        file: "https://archive.org/download/top-mix-izran-best-off-2023-part-10-hd/ISMA3IL BELE3OUCH ANASHID RIF 2021 HD.mp4",
image: "cover.jpg"
      },
      {
        title: "MAHER ZAINE ANASHID AL9OREANE HD",
        file: "https://archive.org/download/top-mix-izran-best-off-2023-part-8-hd/MAHER ZAINE ANASHID AL9OREANE MONTAGE 2021 HD.mp4",
image: "cover.jpg"
      },
      {
        title: "New izran Anashid Rif Music Mashallah 2022 4K UHD",
        file: "https://archive.org/download/top-izran-narif-mega-mix-best-off-2023-part-22-hd/New izran  Anashid Rif Music Mashallah 2022 4K UHD.mp4",
image: "cover.jpg"
      },
      {
        title: "Tifyur Arazik Anashid Mariage izran HD",
        file: "https://archive.org/download/top-izran-mix-2023-part-11-hd/Tifyur Arazik Anashid Mariage izran RIF 2021 HD.mp4",
image: "cover.jpg"
      }
    ];

    // 🔹 Génération de la grille
    const grid = document.getElementById('grid');
    playlist.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = 'thumbnail-item';
      const thumb = item.image || 'https://via.placeholder.com/300?text=Vidéo';
      div.innerHTML = `
        <img src="${thumb}" alt="${item.title}" loading="lazy">
        <div class="title">${item.title}</div>
      `;
      div.onclick = () => playVideo(index);
      grid.appendChild(div);
    });

    // 🔹 Initialisation de Video.js
    const player = videojs('my-video', {
      fluid: true, // S'adapte à la taille de l'écran
      responsive: true,
      playbackRates: [0.5, 1, 1.25, 1.5, 2], // Vitesse de lecture
      controlBar: {
        pictureInPictureToggle: true // Mode Picture-in-Picture
      }
    });

    let currentPlaylistIndex = 0;

    // 🔹 Fonction pour lire une vidéo spécifique
    function playVideo(index) {
      currentPlaylistIndex = index;
      const item = playlist[index];
      
      document.getElementById('video-title').textContent = item.title;
      document.getElementById('player-container').classList.add('active');

      // Mise à jour de la source dans Video.js
      player.src({ type: 'video/mp4', src: item.file });
      player.poster(item.image);
      
      // Lancement de la vidéo
      player.play().catch(e => console.log("Autoplay bloqué par le navigateur, l'utilisateur doit cliquer sur play."));
    }

    // 🔹 Avance automatique à la vidéo suivante
    player.on('ended', function() {
      if (currentPlaylistIndex < playlist.length - 1) {
        playVideo(currentPlaylistIndex + 1);
      }
    });

    // 🔹 Bouton de fermeture
    function closePlayer() {
      document.getElementById('player-container').classList.remove('active');
      player.pause();
    }
    document.getElementById('close-btn').onclick = closePlayer;

    // 🔍 Système de recherche
    document.getElementById('search-input').addEventListener('input', function(e) {
      const query = e.target.value.toLowerCase();
      const items = document.querySelectorAll('.thumbnail-item');
      
      items.forEach(item => {
        const title = item.querySelector('.title').textContent.toLowerCase();
        item.style.display = title.includes(query) ? 'block' : 'none';
      });
    });
  </script>
