<!DOCTYPE html>
<html lang="fr">
<head><script src="/.nekoweb-api/static/site.js" defer></script><script src="/.nekoweb-api/static/site.js" defer></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#ffffff">
  <title>Sabrina Izran • Rif Music</title>
  <link href="theme.css" rel="stylesheet">
  <!-- Inclusion de Video.js via CDN (Pas besoin d'héberger les fichiers) -->
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="theme.js"></script>
 </head>
<body>
  <button id="theme-toggle" aria-label="Basculer entre thème clair et sombre" title="Changer de thème">🌙</button>

  <header>
    <h1>Sabrina Izran</h1>
    <p>Vidéos officielles • Rif Music</p>
    <div class="search-wrapper">
      <input type="text" id="search-input" placeholder="Rechercher une vidéo...">
    </div>
  </header>

  <main id="grid"></main>

  <div id="player-container">
    <button id="close-btn" aria-label="Fermer">&times;</button>
    <div id="player-wrapper">
      <!-- Lecteur Video.js -->
      <video id="my-video" class="video-js" controls preload="auto" playsinline>
        <source src="" type="video/mp4" />
      </video>
    </div>
    <div id="video-title"></div>
  </div>

  <!-- Script Video.js -->
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  
  <script>
    // 🌙 Le thème est maintenant géré par theme.js (chargé dans le <head>)
    // → Plus besoin de code de thème ici !

    // 🔹 Votre Playlist
    const playlist = [
      {
        title: "Sabrina Ak Hamid OUssama izran Tenayi L7ob Rif Music 2022 HD",
        file: "https://archive.org/download/movies-movies-top-izran-narif-mega-mix-best-off-2023-part-14-hd/Sabrina Ak Hamid OUssama izran Tenayi L7ob Rif Music 2022 HD.mp4",
        image: "cover.jpg"
      },
      {
        title: "Sabrina AK Jalal izran Be3dayi Rif Music 2022 HD",
        file: "https://archive.org/download/top-izran-narif-mega-mix-best-off-2023-part-15-hd/Sabrina AK Jalal izran Be3dayi Rif Music 2022 HD.mp4",
        image: "cover.jpg"
      },
      {
        title: "Sabrina Izran Narif hebayi a R3mer Rif Music 2022 HD",
        file: "https://archive.org/download/top-izran-narif-mega-mix-best-off-2023-part-15-hd/Sabrina Izran Narif hebayi a R3mer Rif Music 2022 HD.mp4",
        image: "cover.jpg"
      },
      {
        title: "Sabrina Izran Hindi Rif Music 2022 HD",
        file: "https://archive.org/download/top-izran-narif-mega-mix-best-off-2023-part-15-hd/Sabrina Izran Hindi Rif Music 2022 HD.mp4",
        image: "cover.jpg"
      },
      {
        title: "Sabrina izran Seqsi X Ourino Rif Music 2022 HD",
        file: "https://archive.org/download/movies-movies-top-izran-narif-mega-mix-best-off-2023-part-14-hd/Sabrina izran Seqsi X Ourino Rif Music 2022 HD.mp4",
        image: "cover.jpg"
      },
      {
        title: "Hamid Oussama Ak Sabrina izran Hindi Mix 2022 HD",
        file: "https://archive.org/download/movies-movies-top-izran-narif-mega-mix-best-off-2023-part-14-hd/Hamid Oussama Ak Sabrina izran Hindi Mix 2022 HD.mp4",
        image: "cover.jpg"
      },
      {
        title: "Mix Sabrina Izran Narif Music 2022 HD",
        file: "https://archive.org/download/top-mix-izran-best-off-2023-part-9-hd/Mix Sabrina Izran Narif Music 2022 HD.mp4",
        image: "cover.jpg"
      }
    ];

    // 🔹 Génération de la grille
    const grid = document.getElementById('grid');
    playlist.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = 'thumbnail-item';
      const thumb = item.image || 'https://via.placeholder.com/300?text=Vidéo';
      div.innerHTML = `
        <img src="${thumb}" alt="${item.title}" loading="lazy">
        <div class="title">${item.title}</div>
      `;
      div.onclick = () => playVideo(index);
      grid.appendChild(div);
    });

    // 🔹 Initialisation de Video.js
    const player = videojs('my-video', {
      fluid: true, // S'adapte à la taille de l'écran
      responsive: true,
      playbackRates: [0.5, 1, 1.25, 1.5, 2], // Options de vitesse de lecture
      controlBar: {
        pictureInPictureToggle: true // Mode Picture-in-Picture
      }
    });

    let currentPlaylistIndex = 0;

    // 🔹 Fonction pour lire une vidéo spécifique
    function playVideo(index) {
      currentPlaylistIndex = index;
      const item = playlist[index];
      
      document.getElementById('video-title').textContent = item.title;
      document.getElementById('player-container').classList.add('active');

      // Mise à jour de la source dans Video.js
      player.src({ type: 'video/mp4', src: item.file });
      player.poster(item.image);
      
      // Lancement de la vidéo (le navigateur peut bloquer l'autoplay avec le son)
      player.play().catch(e => console.log("Autoplay bloqué par le navigateur, l'utilisateur doit cliquer sur play."));
    }

    // 🔹 Avance automatique à la vidéo suivante (simulation de playlist)
    player.on('ended', function() {
      if (currentPlaylistIndex < playlist.length - 1) {
        playVideo(currentPlaylistIndex + 1);
      } else {
        // Optionnel : Fermer le lecteur à la fin de la playlist
        // closePlayer();
      }
    });

    // 🔹 Bouton de fermeture
    function closePlayer() {
      document.getElementById('player-container').classList.remove('active');
      player.pause();
    }
    document.getElementById('close-btn').onclick = closePlayer;

    // 🔍 Système de recherche
    document.getElementById('search-input').addEventListener('input', function(e) {
      const query = e.target.value.toLowerCase();
      const items = document.querySelectorAll('.thumbnail-item');
      
      items.forEach(item => {
        const title = item.querySelector('.title').textContent.toLowerCase();
        item.style.display = title.includes(query) ? 'block' : 'none';
      });
    });
  </script>
