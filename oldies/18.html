<head><script src="/.nekoweb-api/static/site.js" defer></script><script src="/.nekoweb-api/static/site.js" defer></script><script src="/.nekoweb-api/static/site.js" defer></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nawal Ak Jalal oldies</title>
    <link href="theme.css" rel="stylesheet">
  <!-- Inclusion de Video.js via CDN -->
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="theme.js"></script>
</head>
<body><button id="theme-toggle">🌙</button>
  <header>
    <h1>Nawal Ak Jalal oldies</h1>
    <p>Vidéos officielles • Rif Music</p>
    <div style="margin-top: 16px; max-width: 500px; margin: 16px auto 0;">
      <input type="text" id="search-input" placeholder="Rechercher une vidéo..." 
             style="width: 100%; padding: 10px; font-size: 15px; border: 1px solid #ddd; border-radius: 24px; outline: none;">
    </div>
  </header>

  <main id="grid"></main>

  <div id="player-container">
    <button id="close-btn" aria-label="Fermer">&times;</button>
    <div id="player-wrapper">
      <!-- Lecteur Video.js -->
      <video id="my-video" class="video-js" controls preload="auto" playsinline>
        <source src="" type="video/mp4" />
      </video>
    </div>
    <div id="video-title"></div>
  </div>

  <!-- Script Video.js -->
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  
   <script>
    // 🔹 Toutes les 10 vidéos de simane
    const playlist = [
        {
        title: "1-Izran NaRif Trio ayourino by Nawal HD",
        file: "https://archive.org/download/top-izran-narif-mega-mix-best-off-2023-part-18-hd/IZRAN%20NARIF%20-Trio%20ayourino%20by%20Nawal%20Rif%20Music%202022%20HD.mp4",
                image: "cover.jpg"
      },
      {
        title: "2-Izran NaRif ayourinou watznuzegh by Nawal HD",
        file: "https://dn721600.ca.archive.org/0/items/top-izran-narif-mega-mix-best-off-2023-part-25-hd/NAWAL%20AK%20JALAL%20-%20Ayourino%20Watezenouzegh%20RIF%20MUSIC%202021%20HD.mp4",
                image: "cover.jpg"

      },
      {
        title: "3-izran NaRif Akhezarth X tittawin HD",
        file: "https://dn710007.ca.archive.org/0/items/nawal-ak-jalal-a-khezarth-kh-tittawin-rif-music-2021-hd/NAWAL%20AK%20JALAL%20-%20A%20KHEZARTH%20KH%20TITTAWIN%20%20RIF%20MUSIC%202021%20HD.mp4",
                image: "cover.jpg"
      },
      {
        title: "4-izran NaRif Ya 7essera ya liyam HD",
        file: "https://archive.org/download/nawal-ak-jalal-ya-7-essera-ya-lyaame-rif-music-2021-hd/NAWAL%20AK%20JALAL%20YA%207ESSERA%20YA%20LYAAME%20%20RIF%20MUSIC%202021%20HD.mp4",
                image: "cover.jpg"
      },

  {
        title: "5-Izran NaRif henny-kh-fuss-nem HD",
        file: "https://dn721900.ca.archive.org/0/items/nawal-ak-jalal-izran-henny-kh-fuss-nem-rif-music-2024-hd/Nawal%20AK%20Jalal%20-%20izran%20henny%20kh%20fuss%20nem%20Rif%20Music%202024%20HD(1).mp4",
                image: "cover.jpg"
      },


  {
        title: "6-izran narif chikht-ala-ghafla HD",
        file: "https://archive.org/download/nawal-ak-jalal-izran-chikht-ala-ghafla-rif-music-2022-hd/Nawal%20AK%20Jalal%20izran%20Chikht%20Ala%20Ghafla%20Rif%20Music%202022%204K%20UHD.mp4",
                image: "cover.jpg"
      },

{
        title: "7-izran narif mani idja mani HD",
        file: "https://archive.org/download/nawal-ak-jalal-mani-idja-mani-rif-music-2024-hd/Nawal%20Ak%20Jalal%20Mani%20idja%20Mani%20Rif%20Music%202024%20HD.mp4",
                image: "cover.jpg"
      },
{
        title: "8-izran narif yekhessichek ourino HD",
        file: "https://dn800304.us.archive.org/0/items/top-izran-narif-mega-mix-best-off-2023-part-12-hd/Nawal%20Ak%20Jalal%20Yexssicek%20Ourino%20VOSTFR%20HD.mp4",

                image: "cover.jpg"

      },
    {
        title: "9-izran narif L7oub ibane Xafi HD",
        file: "https://dn720407.ca.archive.org/0/items/movies-movies-top-izran-narif-mega-mix-best-off-2023-part-14-hd/izran%20narif%20l7oub%20ibane%20khafi%20HD.mp4",

                image: "cover.jpg"

      }
       
 ];

// 🔹 Génération de la grille
    const grid = document.getElementById('grid');
    playlist.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = 'thumbnail-item';
      const thumb = item.image || 'https://via.placeholder.com/300?text=Vidéo';
      div.innerHTML = `
        <img src="${thumb}" alt="${item.title}" loading="lazy">
        <div class="title">${item.title}</div>
      `;
      div.onclick = () => playVideo(index);
      grid.appendChild(div);
    });

    // 🔹 Initialisation de Video.js
    const player = videojs('my-video', {
      fluid: true, // S'adapte à la taille de l'écran
      responsive: true,
      playbackRates: [0.5, 1, 1.25, 1.5, 2], // Vitesse de lecture
      controlBar: {
        pictureInPictureToggle: true // Mode Picture-in-Picture
      }
    });

    let currentPlaylistIndex = 0;

    // 🔹 Fonction pour lire une vidéo spécifique
    function playVideo(index) {
      currentPlaylistIndex = index;
      const item = playlist[index];
      
      document.getElementById('video-title').textContent = item.title;
      document.getElementById('player-container').classList.add('active');

      // Mise à jour de la source dans Video.js
      player.src({ type: 'video/mp4', src: item.file });
      player.poster(item.image);
      
      // Lancement de la vidéo
      player.play().catch(e => console.log("Autoplay bloqué par le navigateur, l'utilisateur doit cliquer sur play."));
    }

    // 🔹 Avance automatique à la vidéo suivante
    player.on('ended', function() {
      if (currentPlaylistIndex < playlist.length - 1) {
        playVideo(currentPlaylistIndex + 1);
      }
    });

    // 🔹 Bouton de fermeture
    function closePlayer() {
      document.getElementById('player-container').classList.remove('active');
      player.pause();
    }
    document.getElementById('close-btn').onclick = closePlayer;

    // 🔍 Système de recherche
    document.getElementById('search-input').addEventListener('input', function(e) {
      const query = e.target.value.toLowerCase();
      const items = document.querySelectorAll('.thumbnail-item');
      
      items.forEach(item => {
        const title = item.querySelector('.title').textContent.toLowerCase();
        item.style.display = title.includes(query) ? 'block' : 'none';
      });
    });
  </script>
