<html lang="fr">
<head><script src="/.nekoweb-api/static/site.js" defer></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Top Compilation Rif</title>
    <link href="theme.css" rel="stylesheet">
  <!-- Inclusion de Video.js via CDN -->
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="theme.js"></script>
</head>
<body><button id="theme-toggle">🌙</button>
  <header>
    <h1>Top Compilation Rif</h1>
    <p>Vidéos officielles • Rif Music</p>
    <div style="margin-top: 16px; max-width: 500px; margin: 16px auto 0;">
      <input type="text" id="search-input" placeholder="Rechercher une vidéo..." 
             style="width: 100%; padding: 10px; font-size: 15px; border: 1px solid #ddd; border-radius: 24px; outline: none;">
    </div>
  </header>

  <main id="grid"></main>

  <div id="player-container">
    <button id="close-btn" aria-label="Fermer">&times;</button>
    <div id="player-wrapper">
      <!-- Lecteur Video.js -->
      <video id="my-video" class="video-js" controls preload="auto" playsinline>
        <source src="" type="video/mp4" />
      </video>
    </div>
    <div id="video-title"></div>
  </div>

  <!-- Script Video.js -->
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  
   <script>
    // 🔹 Toutes les 10 vidéos de Sabrina
    const playlist = [
      {
        title: "1-Izran Ralla Bouya Top Compilation 2024 HD ",
        file: "https://archive.org/download/izran-ralla-bouya-top-compilation-2024-hd/izran Ralla Bouya top compilation 2024 HD.mp4",
image: "cover.jpg"
      },
      {
        title: "2-Top 10 Izran Narif Compilation 2024 HD",
        file: "https://archive.org/download/top-10-izran-narif-compilation-2024-hd/Top 10 izran Narif Compilation 2024 HD.mp4",
                image: "cover.jpg"

      },
      {
        title: "3-Top Anashid Maher Zaine Compilation 2024 HD",
        file: "https://archive.org/download/top-anashid-maher-zaine-compilation-2024-hd/Top Anashid Maher Zaine Compilation 2024 HD.mp4",
image: "cover.jpg"
      },
      {
        title: "4-Top Soufian Izran Remix Compilation 2024 HD ",
        file: "https://archive.org/download/top-soufian-izran-remix-compilation-2024-hd/Top Soufian Izran Remix compilation 2024 HD.mp4",
image: "cover.jpg"
      },

  {
        title: "5-Death Note Epic OST Compilation HQ",
        file: "https://archive.org/download/death-note-epic-ost-hq/Death_Note_epic_OST_HQ.mp4",
image: "cover.jpg"
      },


  {
        title: "6-izran N L7oub compilation best of all times 2025 HQ",
        file: "https://archive.org/download/izran-nlhoub-hd/izran nlhoub hd.mp4",
image: "cover.jpg"
      },

  {
        title: "7-Jdid Compilation Best Off Rif Music 2023 2024 HD",
        file: "https://archive.org/download/jdid-compilation-best-off-rif-music-2023-2024-hd/jdid Compilation Best off Rif Music 2023-2024 HD.mp4",
image: "cover.jpg"
      },


 {
        title: "8-Mix Anass Rif Music Compilation 2024 HD",
        file: "https://archive.org/download/mix-anass-rif-music-compilation-2024-hd/mix anass rif music Compilation 2024 HD.mp4",
image: "cover.jpg"
      },


 {
        title: "9-Mix Milouda Izran Compilation 2024 HD",
        file: "https://archive.org/download/mix-milouda-izran-compilation-2024-hd/Mix Milouda izran Compilation 2024 HD.mp4",
image: "cover.jpg"
      },
      {
        title: "10-Mix Rachid Anass Top Izran Ourar Compilation 2024 HD",
        file: "https://archive.org/download/mix-rachid-anass-top-izran-ourar-compilation-2024-hd/Mix Rachid Anass Top izran Ourar Compilation 2024 HD.mp4",
image: "cover.jpg"
      },


{
        title: "11-Mix Sa3id Mariwari Compilation Rif Music 2024 HD",
        file: "https://archive.org/download/mix-sa3id-mariwari-compilation-rif-music-2024-hd/Mix Sa3id Mariwari Compilation Rif Music 2024 HD.mp4",
image: "cover.jpg"
      },

{
        title: "12-TOP MO Temessamani izran compilation 2023 HD",
        file: "https://ia800509.us.archive.org/29/items/top-izran-mix-music-2023-part-2-hd/TOP MO Temessamani izran compilation 2023 HD.mp4",
image: "cover.jpg"
      } 
 ];

// 🔹 Génération de la grille
    const grid = document.getElementById('grid');
    playlist.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = 'thumbnail-item';
      const thumb = item.image || 'https://via.placeholder.com/300?text=Vidéo';
      div.innerHTML = `
        <img src="${thumb}" alt="${item.title}" loading="lazy">
        <div class="title">${item.title}</div>
      `;
      div.onclick = () => playVideo(index);
      grid.appendChild(div);
    });

    // 🔹 Initialisation de Video.js
    const player = videojs('my-video', {
      fluid: true, // S'adapte à la taille de l'écran
      responsive: true,
      playbackRates: [0.5, 1, 1.25, 1.5, 2], // Vitesse de lecture
      controlBar: {
        pictureInPictureToggle: true // Mode Picture-in-Picture
      }
    });

    let currentPlaylistIndex = 0;

    // 🔹 Fonction pour lire une vidéo spécifique
    function playVideo(index) {
      currentPlaylistIndex = index;
      const item = playlist[index];
      
      document.getElementById('video-title').textContent = item.title;
      document.getElementById('player-container').classList.add('active');

      // Mise à jour de la source dans Video.js
      player.src({ type: 'video/mp4', src: item.file });
      player.poster(item.image);
      
      // Lancement de la vidéo
      player.play().catch(e => console.log("Autoplay bloqué par le navigateur, l'utilisateur doit cliquer sur play."));
    }

    // 🔹 Avance automatique à la vidéo suivante
    player.on('ended', function() {
      if (currentPlaylistIndex < playlist.length - 1) {
        playVideo(currentPlaylistIndex + 1);
      }
    });

    // 🔹 Bouton de fermeture
    function closePlayer() {
      document.getElementById('player-container').classList.remove('active');
      player.pause();
    }
    document.getElementById('close-btn').onclick = closePlayer;

    // 🔍 Système de recherche
    document.getElementById('search-input').addEventListener('input', function(e) {
      const query = e.target.value.toLowerCase();
      const items = document.querySelectorAll('.thumbnail-item');
      
      items.forEach(item => {
        const title = item.querySelector('.title').textContent.toLowerCase();
        item.style.display = title.includes(query) ? 'block' : 'none';
      });
    });
  </script>
