<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diko-Ai - Windows XP Edition</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Tahoma', Arial, sans-serif;
  background: linear-gradient(135deg, #0041C2 0%, #0074E8 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.window {
  width: 100%;
  max-width: 800px;
  background: #F1F1F1;
  border: 3px solid #0055E5;
  border-radius: 8px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  overflow: hidden;
}

.title-bar {
  background: linear-gradient(to bottom, #0055E5 0%, #0033CC 100%);
  color: white;
  padding: 8px 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: move;
  user-select: none;
  font-weight: bold;
  font-size: 14px;
}

.title-bar .title { display: flex; align-items: center; gap: 10px; }
.title-bar .title i { font-size: 16px; }

.window-controls { display: flex; gap: 5px; }

.btn-xp {
  width: 20px; height: 20px;
  border: 1px solid #000; border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: bold; cursor: pointer; user-select: none;
}
.btn-minimize { background: linear-gradient(to bottom, #FFCC00, #FF9900); color: #000; }
.btn-maximize { background: linear-gradient(to bottom, #00CC00, #009900); color: #FFF; }
.btn-close { background: linear-gradient(to bottom, #FF3333, #CC0000); color: #FFF; }
.btn-close:hover { box-shadow: 0 0 10px rgba(255,0,0,0.5); }

.window-content { padding: 15px; background: #F1F1F1; }

.menu-bar {
  background: linear-gradient(to bottom, #E0E0E0, #C0C0C0);
  border-bottom: 2px solid #000;
  padding: 5px; display: flex; gap: 15px;
  font-size: 12px; font-weight: bold; user-select: none;
}
.menu-item { padding: 3px 8px; border-radius: 3px; cursor: pointer; }
.menu-item:hover { background: linear-gradient(to bottom, #0055E5, #0033CC); color: white; }

.search-container {
  background: white; border: 2px solid #0055E5; border-radius: 5px;
  padding: 10px; margin: 15px 0; display: flex; gap: 10px;
}
.search-container input { flex: 1; border: none; outline: none; font-size: 14px; padding: 8px; }
.search-container button {
  background: linear-gradient(to bottom, #0055E5, #0033CC);
  color: white; border: 2px solid #000; border-radius: 5px;
  padding: 8px 15px; font-weight: bold; cursor: pointer; font-size: 14px;
}

.results {
  background: white; border: 2px solid #0055E5; border-radius: 5px;
  padding: 15px; margin-top: 15px; max-height: 400px; overflow-y: auto;
}
.result-item { border-bottom: 1px solid #E0E0E0; padding: 15px; margin-bottom: 10px; }
.result-item:last-child { border-bottom: none; margin-bottom: 0; }
.result-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px; padding-bottom: 5px; border-bottom: 2px solid #0055E5;
}
.result-title { font-weight: bold; font-size: 16px; color: #0055E5; }
.result-lang { font-size: 12px; padding: 3px 8px; border-radius: 10px; font-weight: bold; }
.lang-tifinagh { background: #4CAF50; color: white; }
.result-body { display: grid; grid-template-columns: 120px 1fr; gap: 10px 15px; font-size: 14px; }
.result-label { font-weight: bold; color: #555; }
.result-value { color: #000; word-break: break-word; }

.status-bar {
  background: linear-gradient(to bottom, #E0E0E0, #C0C0C0);
  border-top: 2px solid #000; padding: 5px 15px; font-size: 12px;
  display: flex; justify-content: space-between;
}

.start-menu { position: fixed; bottom: 10px; left: 10px; }
.start-btn {
  background: linear-gradient(to bottom, #0055E5, #0033CC);
  color: white; border: 2px solid #000; border-radius: 5px;
  padding: 8px 15px; font-weight: bold; cursor: pointer;
  display: flex; align-items: center; gap: 8px; font-size: 14px;
}
.start-panel {
  position: fixed; bottom: 55px; left: 10px; width: 230px;
  background: #F1F1F1; border: 2px solid #0055E5; border-radius: 6px 6px 6px 0;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; z-index: 1000;
}
.start-panel-header {
  background: linear-gradient(to bottom, #0055E5, #0033CC);
  color: #fff; padding: 10px 12px; font-weight: bold; font-size: 13px;
}
.start-panel-item { padding: 8px 12px; font-size: 13px; cursor: pointer; }
.start-panel-item:hover { background: #0055E5; color: white; }

.window.maximized { max-width: 100%; height: calc(100vh - 40px); display: flex; flex-direction: column; }
.window.maximized .window-content { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.window.maximized .results { flex: 1; max-height: none; }

.favorite-star { cursor: pointer; font-size: 20px; color: #CCC; margin-left: 5px; }
.favorite-star.liked { color: #FFD700; text-shadow: 0 0 5px rgba(255,215,0,0.7); }

.btn-read {
  background: linear-gradient(to bottom, #FFCC00, #FF9900);
  border: 1px solid #808080; width: 30px; height: 25px;
  font-size: 14px; cursor: pointer; margin-left: 5px; border-radius: 3px;
}

@media (max-width: 600px) {
  .result-body { grid-template-columns: 1fr; }
  .search-container { flex-direction: column; }
  .search-container button { width: 100%; }
}
</style>
</head>

  <div class="start-menu">

    <div class="start-panel-item" onclick="showFavorites(); toggleStartMenu();">⭐ Mes favoris</div>

    <div class="start-panel-item" onclick="clearResults(); toggleStartMenu();">🗑️ Effacer</div>
    <div class="start-panel-item" onclick="toggleTTS()">🔊 Lecture auto (TTS)</div>

    <div class="menu-bar">

      <div class="status-bar">

      </div>
    </div>

    // ---- Chargement tolérant : une ligne fautive ne casse plus rien ----
    function chargerLexique(brut) {
      const lignes = brut.replace(/}\s*,?\s*\{/g, '}\n{').split('\n');
      const mots = [], ignorees = [];
      lignes.forEach(function (l) {
        l = l.trim();
        if (!l || l.charAt(0) !== '{') return;   // ignore le reste
        l = l.replace(/[,\s;]+$/, '');           // enlève la virgule finale s'il y en a une
        try {
          const o = JSON.parse(l);
          if (o && (o.latin || o.tifinagh)) mots.push(o);
        } catch (e) { ignorees.push(l); }        // ligne invalide → ignorée, pas de plantage
      });
      return { mots: mots, ignorees: ignorees };
    }

    const chargement = chargerLexique(DATA_BRUT);
    const lexique = chargement.mots;

    let ttsEnabled = false;

    function $(id) { return document.getElementById(id); }
    function setStatus(t) { $('statusText').textContent = t; }
    function favKey(w) { return (w.latin || '') + '|' + (w.tifinagh || ''); }
    function esc(s) {
      return (s == null ? '' : String(s)).replace(/&/g, '&amp;')
        .replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function normalize(s) {
      return (s == null ? '' : String(s)).toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[.,!?;:'"()]/g, '').replace(/\s+/g, ' ').trim();
    }

      if ($('mainWindow').style.display === 'none') $('mainWindow').style.display = '';
      if (minimized) minimizeWindow();

    // ---- Favoris ----
    function toggleFavResult(i, el) {
      const w = lastResults[i]; if (!w) return;
      const k = favKey(w), idx = favorites.indexOf(k);
      if (idx >= 0) { favorites.splice(idx, 1); el.classList.remove('liked'); }
      else { favorites.push(k); el.classList.add('liked'); }
      try { localStorage.setItem('dikoai_favorites', JSON.stringify(favorites)); } catch (e) {}
    }
    function showFavorites() {

    // ---- Affichage ----

    // ---- Recherche ----
    function searchWords() {
      const raw = $('searchInput').value;
      const q = normalize(raw);
      if (!q) { clearResults(); return; }
      const res = lexique.filter(w =>
        [w.latin, w.tifinagh, w['français'], w.darija].some(v => normalize(v).includes(q)));
      renderResults(res);
      setStatus(res.length + ' résultat(s) pour « ' + raw.trim() + ' »');
      if (ttsEnabled && res.length) autoSpeak(res[0]);
    }

       // ---- TTS ROBUSTE (voix auto-détectées + repli intelligent) ----
    let VOICES = [];
    function refreshVoices() {
      if ('speechSynthesis' in window) VOICES = speechSynthesis.getVoices() || [];
    }
    refreshVoices();
    if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = refreshVoices;

    function pickVoice(prefs) {
      for (var i = 0; i < prefs.length; i++) {
        for (var j = 0; j < VOICES.length; j++) {
          var lang = (VOICES[j].lang || '').toLowerCase().replace('_', '-');
          if (lang.indexOf(prefs[i]) === 0) return VOICES[j];
        }
      }
      return null;
    }

    // Convertit l'Arabizi en texte prononçable : 7→h, 3→a, 9→q, 2→rien
    function pourTTS(s) {
      return String(s == null ? '' : s)
        .replace(/7/g, 'h').replace(/3/g, 'a').replace(/9/g, 'q').replace(/2/g, '')
        .replace(/[?!"'’,. ;:()\-]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function estArabe(s) { return /[\u0600-\u06FF]/.test(String(s == null ? '' : s)); }

    function toggleTTS() {
      ttsEnabled = !ttsEnabled;
      $('ttsStatus').textContent = ttsEnabled ? 'ON' : 'OFF';
      setStatus('Lecture auto : ' + (ttsEnabled ? 'ON' : 'OFF'));
    }

    function speakText(texte, prefs) {
      if (!texte) return;
      if (!('speechSynthesis' in window)) { setStatus('⚠️ Synthèse vocale non supportée'); return; }
      refreshVoices();
      var u = new SpeechSynthesisUtterance(String(texte));
      var v = pickVoice(prefs);
      if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = prefs[0]; }
      u.rate = 0.85;
      speechSynthesis.cancel();
      setTimeout(function () { speechSynthesis.speak(u); }, 150); // évite le bug Chrome cancel+speak
    }

    function speakResult(i, field) {
      var w = lastResults[i]; if (!w) return;
      var texte, prefs, label;
      if (field === 'tifinagh') {
        if (pickVoice(['zgh'])) { texte = w.tifinagh; prefs = ['zgh']; }   // vraie voix Tamazight si elle existe
        else { texte = w.latin; prefs = ['fr-fr', 'fr']; }                 // sinon : transcription latine lue en français
        label = 'Tamazight';
      } else if (field === 'darija') {
        if (estArabe(w.darija)) { texte = w.darija; prefs = ['ar-ma', 'ar']; } // lettres arabes → voix arabe
        else { texte = pourTTS(w.darija); prefs = ['fr-fr', 'fr']; }            // Arabizi → nettoyé puis voix française
        label = 'Darija';
      } else if (field === 'français') {
        texte = w['français']; prefs = ['fr-fr', 'fr']; label = 'Français';
      } else {
        texte = pourTTS(w.latin); prefs = ['fr-fr', 'fr']; label = 'Latin';
      }
      speakText(texte, prefs);
      setStatus('🔊 ' + label + ' : ' + (texte || '—'));
    }

    function autoSpeak(w) {
      if (!('speechSynthesis' in window) || !w) return;
      refreshVoices();
      var zgh = pickVoice(['zgh']);
      var t1 = zgh ? (w.tifinagh || '') : pourTTS(w.latin);
      var p1 = zgh ? ['zgh'] : ['fr-fr', 'fr'];
      var t2 = w['français'] || '';
      speechSynthesis.cancel();
      setTimeout(function () {
        var u1 = new SpeechSynthesisUtterance(String(t1));
        var v1 = pickVoice(p1); if (v1) { u1.voice = v1; u1.lang = v1.lang; } else u1.lang = p1[0];
        u1.rate = 0.85;
        speechSynthesis.speak(u1);
        if (t2) {
          var u2 = new SpeechSynthesisUtterance(String(t2));
          var v2 = pickVoice(['fr-fr', 'fr']); if (v2) { u2.voice = v2; u2.lang = v2.lang; } else u2.lang = 'fr-FR';
          u2.rate = 0.85;
          speechSynthesis.speak(u2);
        }
      }, 150);
    }

    function testVoice(kind) {
      if (kind === 'fr')  speakText('Bonjour, bienvenue dans Diko-Ai', ['fr-fr', 'fr']);
      if (kind === 'ar')  speakText('سلام، مرحبا بكم', ['ar-ma', 'ar']);
      if (kind === 'zgh') speakText('ⴰⵣⵓⵍ', ['zgh']);
    }

    function showVoicePanel() {
      ensureOpen(); lastResults = [];
      refreshVoices();
      var fr = pickVoice(['fr-fr', 'fr']);
      var ar = pickVoice(['ar-ma', 'ar']);
      var zgh = pickVoice(['zgh']);
      function ligne(titre, v, kind) {
        return '<div class="result-label">' + titre + '</div>' +
               '<div class="result-value">' +
                 (v ? '✅ ' + esc(v.name + ' — ' + v.lang) : '❌ non détectée') +
                 ' <button class="btn-read" onclick="testVoice(\'' + kind + '\')">🔊</button>' +
               '</div>';
      }
      $('results').innerHTML =
        '<div class="result-item">' +
          '<div class="result-header"><div class="result-title">🎤 Voix disponibles sur cet appareil</div></div>' +
          '<div class="result-body">' +
            ligne('Français', fr, 'fr') +
            ligne('Arabe / Darija', ar, 'ar') +
            ligne('Tamazight (zgh)', zgh, 'zgh') +
            '<div class="result-label">Solution de repli</div>' +
            '<div class="result-value">Sans voix Tamazight, le 🔊 Tifinagh lit la transcription latine (voix française), et l\'Arabizi est converti (7→h, 3→a, 9→q). Total détectées : ' + VOICES.length + '.</div>' +
          '</div>' +
        '</div>';
      setStatus('Voix détectées : ' + VOICES.length);
    }

    // Ajoute automatiquement le bouton « 🎤 Voix » dans le menu
    (function () {
      var item = document.createElement('div');
      item.className = 'menu-item';
      item.textContent = '🎤 Voix';
      item.onclick = showVoicePanel;
      var bar = document.querySelector('.menu-bar');
      if (bar) bar.appendChild(item);
    })();
    (function initDrag() {
      const win = $('mainWindow'), bar = $('titleBar');
      let dragging = false, ox = 0, oy = 0;
      function start(x, y) {
        if (win.classList.contains('maximized')) return;
        const r = win.getBoundingClientRect();
        win.style.position = 'fixed';
        win.style.left = r.left + 'px'; win.style.top = r.top + 'px';
        win.style.margin = '0'; ox = x - r.left; oy = y - r.top; dragging = true;
      }
      function move(x, y) {
        if (!dragging) return;
        win.style.left = Math.max(0, x - ox) + 'px';
        win.style.top = Math.max(0, y - oy) + 'px';
      }
      bar.addEventListener('mousedown', e => { if (e.target.closest('.btn-xp')) return; start(e.clientX, e.clientY); });
      window.addEventListener('mousemove', e => move(e.clientX, e.clientY));
      window.addEventListener('mouseup', () => dragging = false);
      bar.addEventListener('touchstart', e => { if (e.target.closest('.btn-xp')) return; const t = e.touches[0]; start(t.clientX, t.clientY); }, { passive: true });
      window.addEventListener('touchmove', e => { if (dragging) { const t = e.touches[0]; move(t.clientX, t.clientY); } }, { passive: true });
      window.addEventListener('touchend', () => dragging = false);
    })();

    // ---- Initialisation ----
    $('wordCount').textContent = 'Mots : ' + lexique.length;
    $('results').innerHTML = WELCOME_HTML;
    if (chargement.ignorees.length) {
      console.warn('Lignes ignorées :', chargement.ignorees);
      setStatus('⚠️ ' + lexique.length + ' mots chargés, ' + chargement.ignorees.length + ' ligne(s) ignorée(s) — détail dans la console (F12)');
    } else {
      setStatus('Prêt — ' + lexique.length + ' mots chargés');
    }
    $('searchInput').focus();
  </script>
</body>
</html>
