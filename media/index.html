	margin: 0 auto;
	padding: 0;
	list-style: none
	max-width: 700px;
}
#menu ul {
	width: 100%;
	max-width: 700px;
}
#menu li {
	float: left;
	display: inline;
	position: relative;
}
#menu a {
	display: block;
	line-height: 48px;
	padding: 0 14px;
	text-decoration: none;
	color: #FFFFFF;
	font-size: 16px;
	max-width: 700px;
}
#menu a.dropdown-arrow:after {
	content: "\25BE";

}
#menu li a:hover {
	color: #0099CC;
	background: #F2F2F2;
}
#menu input {

	cursor: pointer

}
#menu label {
	display: none;
	line-height: 48px;
	text-align: center;

	left: 35px
}
#menu label:before {
	font-size: 1.6em;

}
#menu ul.sub-menus{

#menu li:hover ul.sub-menus {

}
#menu ul.sub-menus a:hover{

}
@media screen and (max-width: 100%){

	#menu ul.sub-menus {width:100%;position:static;}
	#menu ul.sub-menus a {padding-left:30px;}
	#menu li {display:block;float:none;width:auto;}
	#menu input, #menu label {position:absolute;top:0;left:0;display:block}

	#menu input:checked ~ ul {display:block}
}
